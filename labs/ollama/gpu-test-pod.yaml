apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  namespace: ai
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: vectoradd
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0@sha256:9855f4c8500addf185360474184b9efdaf4384284779aa9173dcd70164a4ae6f
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
          nvidia.com/gpu: 1
